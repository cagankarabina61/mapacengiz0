# Render Blueprint — tüm altyapı tek dosyada tanımlı, elle panel ayarı gerekmez.
# Kurulum: Render'da "New +" → "Blueprint" → bu repoyu seç.
# (Daha önce elle oluşturulmuş web service/Postgres varsa, karışıklık olmaması
# için önce onları silip Blueprint'ten sıfırdan kurmanız önerilir.)
#
# ÜCRETSİZ PLAN KISITI: Render'ın free planı kalıcı disk ve preDeployCommand
# desteklemiyor. Bu yüzden:
#   - migration + seed, startCommand'a taşındı (her başlangıçta güvenle tekrar
#     çalışır — seed.ts tamamen upsert tabanlıdır/idempotent)
#   - disk bloğu kaldırıldı: /uploads klasörüne yüklenen belgeler/fotoğraflar
#     her deploy'da veya servis yeniden başladığında SİLİNİR. Ücretsiz planda
#     kalıcı dosya depolama yok — ileride gerekirse ücretli plana geçilip
#     disk eklenebilir veya dosya depolama S3/Cloudflare R2'ye taşınabilir.
services:
  - type: web
    name: mapacengiz
    runtime: node
    plan: free
    buildCommand: npm install --production=false && npm run build
    startCommand: npx prisma migrate deploy && npx prisma db seed && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mapacengiz-db
          property: connectionString
      # NOT: Şifreli giriş kaldırıldı (2026-08-18 kullanıcı kararı).
      # AUTH_SECRET / AUTH_TRUST_HOST / SEED_PASSWORD artık GEREKMİYOR.
      # Kullanıcı, açılışta "Kim kullanıyor?" ekranından adını seçer; seçim
      # çerezde saklanır. Bu kimlik doğrulama değildir — site adresini bilen
      # herkes veri girebilir/silebilir.

databases:
  - name: mapacengiz-db
    plan: free
