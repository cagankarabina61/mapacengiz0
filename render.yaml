# Render Blueprint — tüm altyapı tek dosyada tanımlı, elle panel ayarı gerekmez.
# Kurulum: Render'da "New +" → "Blueprint" → bu repoyu seç.
# (Daha önce elle oluşturulmuş web service/Postgres varsa, karışıklık olmaması
# için önce onları silip Blueprint'ten sıfırdan kurmanız önerilir.)
services:
  - type: web
    name: mapacengiz
    runtime: node
    plan: free
    buildCommand: npm install --production=false && npm run build
    startCommand: npm run start
    # Migration + seed her deploy'da güvenle tekrar çalışır — seed.ts tamamen
    # upsert tabanlıdır (idempotent), veriyi tekrarlamaz veya bozmaz.
    preDeployCommand: npx prisma migrate deploy && npx prisma db seed
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mapacengiz-db
          property: connectionString
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_TRUST_HOST
        value: "true"
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1

databases:
  - name: mapacengiz-db
    plan: free
